<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{company} Load Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="signbar">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-logo"><img src="/static/logo.png" alt="Brock Transportation LLC" width="138" height="46"></span>
      <span><span class="brand-name" data-company>Load Board</span><div class="brand-sub" data-tagline></div></span>
    </a>
    <nav></nav>
  </div>
</header>

<main class="wrap">
  <div class="board-head">
    <div>
      <h1>Available loads</h1>
      <div class="muted" id="count">Loading…</div>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search city, state, ref #" aria-label="Search loads">
      <select id="eq" aria-label="Equipment"><option value="">All equipment</option></select>
      <select id="ostate" aria-label="Origin state"><option value="">Any origin</option></select>
    </div>
  </div>
  <div class="loads" id="loads"></div>

  <section class="panel alertbox" id="alertbox">
    <h2>Get loads on your lanes by email</h2>
    <p class="muted" style="margin:0 0 12px">Tell us where you run. We'll email you when a load posts on your lanes — with the rate, details and a one-tap way to answer.</p>
    <form id="alertForm" class="stack" novalidate>
      <div class="grid g3">
        <div class="field"><label for="al_email">Email<span class="req" aria-hidden="true">*</span></label><input id="al_email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="al_name">Name</label><input id="al_name" autocomplete="name"></div>
        <div class="field"><label for="al_mc">MC number</label><input id="al_mc" inputmode="numeric"></div>
      </div>
      <div class="field"><label>Lanes<span class="req" aria-hidden="true">*</span> <span class="hint">(pick up → deliver; leave one side on "Any")</span></label>
        <div class="lanes" id="al_lanes"></div>
        <div><button class="linkbtn" type="button" id="al_add">+ Add another lane</button></div></div>
      <div class="field" style="max-width:240px"><label for="al_eq">Equipment</label><select id="al_eq"><option value="">Any</option><option value="van">Dry van</option><option value="reefer">Reefer</option><option value="flatbed">Flatbed / step deck</option></select></div>
      <div id="al_msg" aria-live="polite"></div>
      <div><button class="btn primary" type="submit">Email me loads</button> <span class="hint">Stop anytime from any alert email.</span></div>
    </form>
  </section>
</main>

<footer class="footer"><div class="wrap">All rates are all-in USD (linehaul + fuel).</div></footer>

<script src="/static/common.js"></script>
<script>

let all = [];

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const eq = $('#eq').value, os = $('#ostate').value;
  const list = all.filter(l => {
    if (eq && l.equipment !== eq) return false;
    if (os && l.origin_state !== os) return false;
    if (!q) return true;
    return [l.ref, l.public_id, l.origin_city, l.origin_state, l.dest_city, l.dest_state, l.commodity, l.equipment].join(' ').toLowerCase().includes(q);
  });
  $('#count').textContent = `${list.length} load${list.length === 1 ? '' : 's'} available` + (list.length !== all.length ? ` (of ${all.length})` : '');
  if (!list.length) {
    $('#loads').innerHTML = `<div class="panel empty">${all.length ? 'No loads match those filters.' : 'No loads are posted right now. Check back soon.'}</div>`;
    return;
  }
  $('#loads').innerHTML = list.map(l => {
    return `<a class="panel load-row" href="/load/${esc(l.public_id)}">
      <div>
        <div class="lane">${esc(place(l.origin_city, l.origin_state, l.origin_zip))} <span class="arrow">→</span> ${esc(place(l.dest_city, l.dest_state, l.dest_zip))}
          ${l.miles ? `<small class="num">${Number(l.miles).toLocaleString()} mi</small>` : ''}</div>
        <div class="meta">
          ${l.equipment ? `<span class="chip eq">${esc(l.equipment)}${l.temp ? ' · ' + esc(l.temp) : ''}</span>` : ''}
          ${l.pickup_date ? `<span class="chip">Pick up ${esc(fmtDate(l.pickup_date))}</span>` : ''}
          ${l.delivery_date ? `<span class="chip">Deliver ${esc(fmtDate(l.delivery_date))}</span>` : ''}
          ${l.weight ? `<span class="chip">${esc(weight(l.weight))}</span>` : ''}
          ${l.stops ? `<span class="chip">${esc(l.stops)} extra stop${l.stops > 1 ? 's' : ''}</span>` : ''}
          ${l.ref ? `<span class="chip mono">#${esc(l.ref)}</span>` : ''}
        </div>
      </div>
      <div class="side">
        <div><div class="lowbid-label">Rate</div>
        <div class="lowbid" style="color:var(--good)">${l.post_rate ? esc(money(l.post_rate)) : 'Make an offer'}</div></div>
        <span class="btn primary sm">View load</span>
      </div>
    </a>`;
  }).join('');
}

function fillSelect(sel, values) {
  const cur = sel.value;
  sel.length = 1;
  [...new Set(values.filter(Boolean))].sort().forEach(v => sel.add(new Option(v, v)));
  sel.value = cur;
}

async function load() {
  try {
    all = await api('/api/loads');
    fillSelect($('#eq'), all.map(l => l.equipment));
    fillSelect($('#ostate'), all.map(l => l.origin_state));
    render();
  } catch (e) {
    $('#loads').innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  }
}
['#q', '#eq', '#ostate'].forEach(s => $(s).addEventListener('input', render));
// lane alerts sign-up
const ST = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' ');
const stOpts = `<option value="">Any</option>` + ST.map(s => `<option>${s}</option>`).join('');
function addLaneRow(o = '', d = '') {
  const row = document.createElement('div'); row.className = 'lanerow';
  row.innerHTML = `<select aria-label="Pickup state" data-o>${stOpts}</select> <span aria-hidden="true">→</span> <select aria-label="Delivery state" data-d>${stOpts}</select>`;
  row.querySelector('[data-o]').value = o; row.querySelector('[data-d]').value = d;
  $('#al_lanes').appendChild(row);
}
addLaneRow();
$('#al_add').onclick = () => { if ($$('#al_lanes .lanerow').length < 6) addLaneRow(); };
try { const c = JSON.parse(localStorage.getItem('carrier') || '{}'); if (c.email) $('#al_email').value = c.email; if (c.contact_name) $('#al_name').value = c.contact_name; if (c.mc) $('#al_mc').value = c.mc; } catch (_) { /* no storage */ }
$('#alertForm').onsubmit = async e => {
  e.preventDefault();
  const lanes = $$('#al_lanes .lanerow').map(r => ({ o: r.querySelector('[data-o]').value, d: r.querySelector('[data-d]').value })).filter(l => l.o || l.d);
  try {
    const r = await api('/api/alerts', { method: 'POST', body: { email: $('#al_email').value, name: $('#al_name').value, mc: $('#al_mc').value, equipment: $('#al_eq').value, lanes } });
    $('#al_msg').innerHTML = `<div class="notice ok"><b>You're set.</b> We'll email ${esc($('#al_email').value)} when loads post on ${r.count === 1 ? 'that lane' : 'those lanes'} — including any that are open right now.</div>`;
  } catch (err) { $('#al_msg').innerHTML = `<div class="notice err">${esc(err.message)}</div>`; }
};

applyBranding();
load();
setInterval(load, 60000);
</script>
</body>
</html>
