services:
  - type: web
    name: freight-load-board
    runtime: node
    plan: starter
    buildCommand: echo "no build step"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEOCODER_USER_AGENT
        value: BrockLoadBoard/1.0 (codyp@sweetcandy.com)
    disk:
      name: loadboard-data
      mountPath: /var/data
      sizeGB: 1
